<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>测你潜意识里的快乐开关</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * {
            font-family: 'Noto Sans SC', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: url("./assets/bg.jpg") no-repeat center center fixed;
            background-size: cover;
        }

        .mask-wrap {
            background-color: rgba(255, 250, 240, 0.72);
            min-height: 100vh;
            backdrop-filter: blur(4px);
        }

        .fade-in {
            animation: fadeIn 0.45s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option-btn {
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: rgba(248, 200, 152, 0.14);
            border-color: #f8c898;
        }

        .result-card {
            background: linear-gradient(160deg, rgba(255, 250, 240, 0.96), rgba(255, 241, 220, 0.96));
            border: 1px solid rgba(248, 200, 152, 0.35);
            box-shadow: 0 18px 45px rgba(180, 140, 90, 0.18);
        }

        .primary-btn {
            background-color: #f8c898;
            color: #fff;
            transition: all 0.2s ease;
        }

        .primary-btn:hover {
            background-color: #f5b57a;
        }

        .primary-btn:active {
            transform: scale(0.96);
        }

        .outline-btn {
            background-color: #fff;
            color: #4b3c30;
            border: 1px solid #f8c898;
            transition: all 0.2s ease;
        }

        .outline-btn:hover {
            background-color: #fff7ec;
        }

        .cover-img {
            width: 260px;
            border-radius: 20px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(180, 140, 90, 0.2);
        }

        #shareCard {
            position: absolute;
            left: -9999px;
            top: 0;
        }

        .share-card-inner {
            width: 750px;
            height: 1000px;
            background: linear-gradient(160deg, #fffaf0 0%, #ffe9cb 100%);
            position: relative;
            overflow: hidden;
            padding: 70px 50px;
            box-sizing: border-box;
        }

        .share-card-inner::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(248, 200, 152, 0.35), transparent 26%),
                radial-gradient(circle at 85% 25%, rgba(255, 230, 180, 0.45), transparent 28%),
                radial-gradient(circle at 78% 88%, rgba(248, 200, 152, 0.28), transparent 32%),
                radial-gradient(circle at 20% 82%, rgba(255, 245, 220, 0.6), transparent 30%);
        }

        .share-card-title {
            position: relative;
            text-align: center;
            color: #b58550;
            font-size: 34px;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .share-card-illustration {
            position: relative;
            text-align: center;
            margin-bottom: 40px;
        }

        .share-card-illustration img {
            width: 420px;
            height: 420px;
            object-fit: contain;
        }

        .share-card-result-title {
            position: relative;
            text-align: center;
            font-size: 64px;
            color: #4b3c30;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .share-card-text {
            position: relative;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            padding: 34px;
            color: #5a4a3c;
            font-size: 30px;
            line-height: 1.9;
            border: 1px solid rgba(248, 200, 152, 0.35);
        }

        .share-card-footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 40px;
            text-align: center;
            color: #b58550;
            font-size: 26px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="mask-wrap">
        <div class="max-w-md mx-auto px-5 py-10">

            <!-- 首页封面 -->
            <div id="page-start" class="fade-in">
                <div class="bg-white rounded-3xl p-8 shadow-lg text-center">
                    < img class="cover-img" src="./assets/cover.png" alt="测试封面" />
                    <h1 class="text-2xl font-bold mb-4 text-textDark">测你潜意识里的快乐开关</h1>
                    <p class="text-sm opacity-80 mb-8 leading-relaxed text-textDark">
                        凭第一直觉选择答案<br />
                        一共5道题，一分钟测出你的快乐内核
                    </p >
                    <button onclick="startTest()" class="primary-btn rounded-full px-10 py-3 text-lg font-medium shadow-md">
                        开始测试
                    </button>
                </div>
            </div>

            <!-- 答题页 -->
            <div id="page-question" class="hidden fade-in">
                <div class="bg-white rounded-3xl p-8 shadow-lg">
                    <div class="mb-4 text-sm opacity-70 text-textDark">
                        第 <span id="q-index">1</span> / 5 题
                    </div>
                    <h2 id="q-title" class="text-lg font-medium mb-6 text-textDark"></h2>
                    <div id="option-box" class="space-y-3"></div>
                </div>
            </div>

            <!-- 结果页 -->
            <div id="page-result" class="hidden fade-in">
                <div class="result-card rounded-3xl p-7 shadow-lg text-center">
                    <div class="text-base mb-2 text-textDark">你的测评结果</div>
                    <div id="result-title" class="text-xl font-bold mb-4 text-textDark"></div>
                    <div id="result-desc" class="text-sm leading-relaxed mb-6 text-textDark"></div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="saveShareCard()" class="outline-btn rounded-full py-3 text-sm font-medium">
                            保存结果图
                        </button>
                        <button onclick="shareToXiaohongshu()" class="primary-btn rounded-full py-3 text-sm font-medium">
                            分享到小红书
                        </button>
                    </div>

                    <button onclick="restart()" class="primary-btn rounded-full px-10 py-3 font-medium shadow-md mt-4">
                        重新测试
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 分享卡片（用于生成结果图片） -->
    <div id="shareCard">
        <div class="share-card-inner">
            <div class="share-card-title">你的快乐内核</div>
            <div class="share-card-illustration">
                < img id="shareImg" src="" alt="result" />
            </div>
            <div class="share-card-result-title" id="shareResultTitle">快乐类型</div>
            <div class="share-card-text" id="shareResultText">结果文案</div>
            <div class="share-card-footer">潜意识里的快乐开关</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#f8c898',
                        bgMain: '#fffaf0',
                        textDark: '#4b3c30'
                    }
                }
            }
        };

        const questions = [
            {
                title: "突然收到免费周末体验券，你第一反应？",
                options: [
                    { txt: "A. 约朋友一起组队打卡", score: 5 },
                    { txt: "B. 提前很久做详细攻略", score: 10 },
                    { txt: "C. 喊上朋友约一场热闹的聚会", score: 15 },
                    { txt: "D. 自己安安静静在家读本书放空", score: 20 }
                ]
            },
            {
                title: "累到疲惫时，哪种犒劳能瞬间回血？",
                options: [
                    { txt: "A. 吃一顿大餐", score: 5 },
                    { txt: "B. 刷短视频放松", score: 10 },
                    { txt: "C. 和朋友聊天倾诉", score: 15 },
                    { txt: "D. 独处发呆休息", score: 20 }
                ]
            },
            {
                title: "周末空闲，你更倾向？",
                options: [
                    { txt: "A. 出门逛市集打卡", score: 5 },
                    { txt: "B. 运动散步", score: 10 },
                    { txt: "C. 和熟人小聚", score: 15 },
                    { txt: "D. 一个人喝茶看书", score: 20 }
                ]
            },
            {
                title: "计划被打乱，你会？",
                options: [
                    { txt: "A. 马上重新安排行程", score: 5 },
                    { txt: "B. 有点烦躁慢慢调整", score: 10 },
                    { txt: "C. 找人商量改方案", score: 15 },
                    { txt: "D. 顺其自然躺平", score: 20 }
                ]
            },
            {
                title: "别人约你出门，你内心？",
                options: [
                    { txt: "A. 很期待，立刻答应", score: 5 },
                    { txt: "B. 想想合适再答应", score: 10 },
                    { txt: "C. 看是什么人", score: 15 },
                    { txt: "D. 优先想在家待着", score: 20 }
                ]
            }
        ];

        const resultConfig = [
            {
                min: 0,
                max: 20,
                title: "外向发光型",
                desc: "你天生热爱热闹，很容易在人群里获得快乐。喜欢和人相处、分享，新鲜的社交体验是你的能量来源。你自带感染力，很容易带动身边人的情绪。",
                img: "./assets/res1.png"
            },
            {
                min: 21,
                max: 40,
                title: "探索体验型",
                desc: "你对新鲜事物抱有好奇心，愿意尝试新玩法。不排斥社交，但也需要空间。快乐来自不断体验、打卡、感受世界，讨厌一成不变的枯燥生活。",
                img: "./assets/res2.png"
            },
            {
                min: 41,
                max: 60,
                title: "平衡从容型",
                desc: "你是冷暖均衡的类型，热闹和独处都能接纳。可以合群，也可以安心一个人待着。情绪稳定，擅长在平凡日常里挖掘属于自己的小快乐。",
                img: "./assets/res3.png"
            },
            {
                min: 61,
                max: 80,
                title: "慢热内收型",
                desc: "你的快乐很挑环境，只愿意留给舒服、信任的人。无效社交会消耗你，适合小圈子深度相处。比起喧嚣，安静松弛的氛围更能治愈你。",
                img: "./assets/res4.png"
            },
            {
                min: 81,
                max: 100,
                title: "自足独处型",
                desc: "你的快乐不需要依靠别人。独处就是充电，内心自洽，很少需要外界的认可和陪伴。你享受安静，精神世界丰盈，不容易被外界裹挟。",
                img: "./assets/res5.png"
            }
        ];

        let current = 0;
        let totalScore = 0;
        let nowResult = null;

        function showPage(id) {
            document.querySelectorAll('#page-start, #page-question, #page-result').forEach(el => {
                el.classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        function startTest() {
            current = 0;
            totalScore = 0;
            renderQuestion();
            showPage('page-question');
        }

        function renderQuestion() {
            const q = questions[current];
            document.getElementById('q-index').innerText = current + 1;
            document.getElementById('q-title').innerText = q.title;
            const box = document.getElementById('option-box');
            box.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full border border-primary/40 rounded-xl px-4 py-3 text-left text-textDark";
                btn.innerText = opt.txt;
                btn.onclick = () => select(opt.score);
                box.appendChild(btn);
            });
        }

        function select(s) {
            totalScore += s;
            current++;

            if (current >= questions.length) {
                showResult();
            } else {
                renderQuestion();
            }
        }

        function showResult() {
            showPage('page-result');
            nowResult = resultConfig.find(item => totalScore >= item.min && totalScore <= item.max);

            document.getElementById('result-title').innerText = nowResult.title;
            document.getElementById('result-desc').innerText = nowResult.desc;

            document.getElementById('shareResultTitle').innerText = nowResult.title;
            document.getElementById('shareResultText').innerText = nowResult.desc;
            document.getElementById('shareImg').src = nowResult.img;
        }

        function restart() {
            showPage('page-start');
        }

        async function saveShareCard() {
            const card = document.getElementById('shareCard');
            try {
                const canvas = await html2canvas(card, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#fffaf0'
                });

                const link = document.createElement('a');
                link.download = nowResult.title + '_测试结果.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('保存失败，可以直接截图哦');
                console.error(err);
            }
        }

        function shareToXiaohongshu() {
            const shareText =
                "我在「测你潜意识里的快乐开关」测出：" + nowResult.title + "\n\n" +
                nowResult.desc + "\n\n" +
                "快来测测你的快乐内核✨";

            navigator.clipboard.writeText(shareText).then(() => {
                alert("文案复制成功！跳转小红书，直接粘贴发布～");
                window.open("https://www.xiaohongshu.com/explore", "_blank");
            }).catch(() => {
                alert("复制失败，请手动复制文案");
            });
        }
    </script>
</body>
</html>
